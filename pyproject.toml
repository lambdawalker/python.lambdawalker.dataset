[build-system]
requires = ["uv_build>=0.8.0"]
build-backend = "uv_build"

[project]
name = "lambdawalker-dataset"
version = "0.1.0"
description = "Dataset and DataProvider management tools for LambdaWalker"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "LambdaWalker", email = "lambdawalker@isdavid.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]
dependencies = [
    "lambdawalker-file>=0.1.0",
    "datasets>=4.5.0",
    "cairosvg>=2.8.2",
    "pyyaml",
    "Pillow>=10.0.0",
    "numpy>=2.0.0"
]

[project.urls]
Homepage = "https://github.com/lambdawalker/python.lambdawalker.dataset"
Repository = "https://github.com/lambdawalker/python.lambdawalker.dataset"
Issues = "https://github.com/lambdawalker/python.lambdawalker.dataset/issues"

[tool.uv.build-backend]
module-name = "lambdawalker.dataset"
namespace = true

[tool.uv.sources]
lambdawalker-file = { git = "ssh://git@github.com/lambdawalker/python.lambdawalker.file.git" }
